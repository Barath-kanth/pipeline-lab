name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
      - hotfix/**

env:
  NODE_VERSION: '20.x'
  APP_NAME: 'Agentic Cloud API Lab'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm' # Optimizes pipeline duration by caching dependencies

      - run: npm install
      - run: npm run test

      - name: Upload Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build-artifact
          path: math.js
          retention-days: 14 # Enforces the artifact retention strategy

      - name: Build Docker Image
        if: ${{ !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: docker build -t pipeline-lab-api:latest .

  deploy-to-production:
    needs: test-and-coverage
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy Application
        run: |
          echo "Deploying ${{ env.APP_NAME }} to Production..."
          if [[ "${{ github.ref }}" == refs/heads/hotfix/* ]]; then
            echo "Hotfix fast-track deploy — Production emergency approval gate required."
          fi
          echo "Deployment successful!"
